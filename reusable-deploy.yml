name: Reusable deployment dispatcher (reference)
on:
  workflow_call:
    inputs:
      runtime:
        required: true
        type: string
      environment:
        required: true
        type: string
      aws_region:
        required: true
        type: string
      release_manifest:
        required: true
        type: string
permissions: {}
jobs:
  deploy:
    if: inputs.environment == 'dev' || inputs.environment == 'stage' || inputs.environment == 'prod'
    runs-on: ubuntu-24.04
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}-${{ inputs.runtime }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4 # production: SHA-pin
        with:
          persist-credentials: false
      - name: Validate manifest and runtime
        env:
          RUNTIME: ${{ inputs.runtime }}
          MANIFEST: ${{ inputs.release_manifest }}
        run: |
          case "$RUNTIME" in eks|ecs|lambda) ;; *) exit 1 ;; esac
          python3 scripts/validate_release.py "$MANIFEST"
      - name: SECURITY HOLD - independent verification required
        run: |
          echo 'FAIL CLOSED: external security-owned verification of digest, provenance, policy, approval and commit is required.'
          exit 1
      # DO NOT remove the hold without integrating an independently owned verification gate.
      # After verification, EKS must use a protected GitOps PR/reconciler; ECS uses an
      # approved task definition digest; Lambda uses an immutable version + alias.
      # No generic AWS administrator role should ever be assumed here.
